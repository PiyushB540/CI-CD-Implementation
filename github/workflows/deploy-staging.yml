name: CI/CD - Deploy to Staging

on:
  push:
    branches:
      - main  # Triggers on every push to staging branch

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout your code
      - name: Checkout Code
        uses: actions/checkout@v3

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      # 3. Install dependencies
      - name: Install Dependencies
        run: npm install

      # 4. Run ESLint
      - name: Run Lint
        run: npm run lint

      # 5. Run Jest Tests
      - name: Run Tests
        run: npm test
        env:
          PORT: 3000
          # Add your other env vars here as GitHub Secrets

      # 6. Trigger Render Deploy (only if tests pass)
      - name: Deploy to Render
        if: success()
        run: |
          curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK_URL }}